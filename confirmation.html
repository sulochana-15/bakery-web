<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .confirmation {

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);

        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #8b3a62;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            background: #8b3a62;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="confirmation">

    <div class="icon">🎉</div>

    <h1>Order Confirmed!</h1>

    <p>
        Thank you for ordering from
        Sweet Delights Bakery.
    </p>

    <p>
        Your delicious treats are being prepared. 🍰
    </p>

    <a href="index.html">
        Back to Home
    </a>

</div>

</body>
</html>
