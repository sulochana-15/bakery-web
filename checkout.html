<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Sweet Delights</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #fff7f9;
            margin: 0;
        }

        header {
            background: #8b3a62;
            color: white;
            padding: 20px 40px;
        }

        .checkout {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #8b3a62;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #checkoutTotal {
            color: #8b3a62;
            font-size: 24px;
        }

    </style>

</head>

<body>

<header>
    <h2>🍰 Sweet Delights Bakery</h2>
</header>


<section class="checkout">

    <h1>Checkout 🛍️</h1>

    <form id="checkoutForm">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            required
            placeholder="Enter your name"
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            required
            placeholder="Enter your email"
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            required
            placeholder="Enter phone number"
        >


        <label>Delivery Address</label>

        <textarea
            id="address"
            rows="4"
            required
            placeholder="Enter delivery address"
        ></textarea>


        <label>Payment Method</label>

        <select id="paymentMethod">

            <option value="Cash on Delivery">
                Cash on Delivery
            </option>

            <option value="UPI">
                UPI
            </option>

        </select>


        <h2>
            Total: ₹<span id="checkoutTotal">0</span>
        </h2>


        <button type="submit">
            Place Order 🍰
        </button>

    </form>

</section>


<script>

const cart =
    JSON.parse(localStorage.getItem("cart")) || [];


let total = 0;

cart.forEach(item => {

    total += item.price * item.quantity;

});


document.getElementById("checkoutTotal")
    .textContent = total;


document.getElementById("checkoutForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const orderProducts = cart.map(item => ({
            name: item.name,
            quantity: item.quantity,
            price: item.price
        }));


        const orderData = {

            customerName:
                document.getElementById("name").value,

            customerEmail:
                document.getElementById("email").value,

            products: orderProducts,

            totalAmount: total,

            address:
                document.getElementById("address").value,

            paymentMethod:
                document.getElementById("paymentMethod").value

        };


        try {

            const response = await fetch(
                "http://localhost:5000/api/orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(orderData)
                }
            );


            if (!response.ok) {

                throw new Error("Order failed");

            }


            localStorage.removeItem("cart");

            window.location.href =
                "confirmation.html";

        } catch (error) {

            alert(
                "Unable to place order. Please check the backend."
            );

            console.error(error);

        }

    });

</script>

</body>
</html>
